name: Deploy P001 Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lessons/P001/**"
      - "theme/**"
      - "brand/**"
      - "package.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build P001
        run: npm run build:p001
      - name: Verify build output
        run: |
          test -f dist/P001/index.html
          find dist/P001 -maxdepth 2 -type f | head -50
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/P001

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
