name: Deploy P001 Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lessons/P001/**"
      - "theme/**"
      - "brand/**"
      - "package.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate
      - run: npm run build:p001
      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp -R dist/P001 site/P001
          cp dist/P001/index.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
