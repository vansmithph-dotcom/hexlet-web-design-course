name: Build master template

on:
  workflow_dispatch:
  push:
    paths:
      - "templates/master/**"
      - "theme/**"
      - "brand/tokens/**"
      - "package.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:master
      - uses: actions/upload-artifact@v4
        with:
          name: hexlet-college-master
          path: dist/master
