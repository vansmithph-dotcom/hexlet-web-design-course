name: Build course

on:
  workflow_dispatch:
  push:
    paths:
      - "lessons/P001/**"
      - "templates/master/**"
      - "theme/**"
      - "brand/**"
      - "package.json"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:all
      - name: Verify static course output
        shell: bash
        run: |
          test -f dist/course/pm1/P001/index.html
          test -f dist/P026/index.html
          test -f dist/master/index.html
          test -f dist/index.html
          test -f dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: course-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
